<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سامانه HSE — ارسال فرم عمومی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background:#f7fafc; color:#0f172a; padding:20px; direction:rtl; }
    .card { background:#fff; border-radius:10px; padding:16px; max-width:720px; margin:16px auto; box-shadow:0 2px 8px rgba(2,6,23,0.06); }
    label { display:block; margin-top:8px; font-weight:600 }
    input, select, textarea { width:100%; padding:8px; margin-top:6px; border:1px solid #e6e9ee; border-radius:6px; box-sizing:border-box; }
    button { margin-top:12px; padding:10px 14px; background:#0369a1; color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .muted { color:#64748b; font-size:0.9rem; margin-top:6px; }
    .result { margin-top:12px; padding:10px; border-radius:6px; background:#e6fffa; color:#064e3b; display:none; }
    .error { background:#ffe4e6; color:#881337; display:none; padding:10px; border-radius:6px; }
  </style>
  <!-- reCAPTCHA v3 (درصورت استفاده کلید سایت را قرار دهید) -->
  <!-- <script src="https://www.google.com/recaptcha/api.js?render=YOUR_RECAPTCHA_SITE_KEY"></script> -->
</head>
<body>
  <div class="card">
    <h2>ارسال فرم عمومی بازرسی</h2>
    <p class="muted">این فرم برای رانندگان یا کاربران عمومی است. اطلاعات برای مدیر سامانه در شیت ذخیره می‌شود.</p>

    <form id="publicForm">
      <label>نام بازرس (اختیاری)</label>
      <input type="text" id="inspector" placeholder="مثلاً: احمد رضایی" />

      <label>نام راننده</label>
      <input type="text" id="driver" placeholder="نام راننده" required />

      <label>نوع چک‌لیست</label>
      <input type="text" id="templateName" placeholder="مثلاً: معاینه فنی روزانه" required />

      <label>تاریخ (yyyy-mm-dd)</label>
      <input type="date" id="date" />

      <label>پلاک - بخش اول (d1)</label>
      <input type="text" id="plate_d1" maxlength="3" />

      <label>پلاک - حرف</label>
      <input type="text" id="plate_letter" maxlength="2" />

      <label>پلاک - بخش دوم (d2)</label>
      <input type="text" id="plate_d2" maxlength="3" />

      <label>پلاک - کد ایران (d3)</label>
      <input type="text" id="plate_d3" maxlength="2" />

      <label>نتایج (JSON یا توضیح)</label>
      <textarea id="results" rows="6" placeholder='مثال: [{"label":"چراغ جلو","status":"good"},{"label":"ترمز","status":"bad","note":"نیاز به سرویس"}]'></textarea>

      <div class="muted">قبل از ارسال ممکن است reCAPTCHA اجرا شود (درصورت فعال‌سازی).</div>
      <button type="submit">ارسال فرم</button>
    </form>

    <div id="ok" class="result"></div>
    <div id="err" class="error"></div>
  </div>

  <script>
    // مقداردهی: آدرس وب‌اپ گوگل (وب‌اپ خود را اینجا قرار دهید)
    const WEB_APP_URL = "https://script.google.com/macros/s/REPLACE_WITH_YOUR_WEBAPP_ID/exec";

    // اگر reCAPTCHA دارید، کلید سایت را اینجا قرار دهید و بالای صفحه script را uncomment کنید
    const RECAPTCHA_SITE_KEY = ""; // "YOUR_RECAPTCHA_SITE_KEY"

    const form = document.getElementById('publicForm');
    const ok = document.getElementById('ok');
    const err = document.getElementById('err');

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      ok.style.display = "none";
      err.style.display = "none";

      const entry = {
        id: "pub_" + Date.now(), // شناسه موقتی
        templateName: document.getElementById('templateName').value || "چک لیست",
        date: document.getElementById('date').value || new Date().toISOString().slice(0,10),
        inspector: document.getElementById('inspector').value || "راننده",
        driver: document.getElementById('driver').value || "",
        plate: {
          d1: document.getElementById('plate_d1').value || "",
          letter: document.getElementById('plate_letter').value || "",
          d2: document.getElementById('plate_d2').value || "",
          d3: document.getElementById('plate_d3').value || ""
        },
        results: [],
        percent: 0,
        generalNotes: ""
      };

      // سعی کنیم textarea JSON را پارس کنیم
      const rawResults = document.getElementById('results').value.trim();
      if (rawResults) {
        try {
          const parsed = JSON.parse(rawResults);
          if (Array.isArray(parsed)) entry.results = parsed;
          else entry.generalNotes = rawResults;
        } catch (e) {
          // اگر JSON نیست، ذخیره به عنوان متن در generalNotes
          entry.generalNotes = rawResults;
        }
      }

      // بسته‌سازی payload مطابق قرارداد: action: submitPublicForm ، db: { publicForms: [...] }
      const payloadObj = {
        action: "submitPublicForm",
        db: {
          publicForms: [ entry ],
          vehicles: [] // در صورت نیاز می‌توانید خودروها را نیز ارسال کنید
        }
      };

      // اگر reCAPTCHA فعال است، ابتدا توکن بگیرید
      if (RECAPTCHA_SITE_KEY && grecaptcha) {
        grecaptcha.ready(function(){
          grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'submit'}).then(function(token){
            payloadObj.recaptchaToken = token;
            sendPayload(payloadObj);
          });
        });
      } else {
        sendPayload(payloadObj);
      }
    });

    function sendPayload(payloadObj) {
      fetch(WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payloadObj)
      }).then(r => r.json()).then(j => {
        if (j && j.success) {
          ok.innerText = "فرم با موفقیت ثبت شد: " + (j.message || "");
          ok.style.display = "block";
          form.reset();
        } else {
          err.innerText = "خطا در ارسال: " + (j && j.message ? j.message : "پاسخ نامشخص از سرور");
          err.style.display = "block";
        }
      }).catch(e => {
        err.innerText = "خطا در تماس با سرور: " + e.toString();
        err.style.display = "block";
      });
    }
  </script>
</body>
</html>
